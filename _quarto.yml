project:
  type: website
  output-dir: _site

execute:
  freeze: auto

website:
  title: "GeoPov"
  favicon: assets/wbg-favicon.png
  repo-url: https://github.com/worldbank/geoPovLearn
  repo-actions: [edit, issue]
  issue-url: https://github.com/worldbank/geoPovLearn/issues/new
  navbar:
    background: light
    foreground: "#123154"
    search: true
    logo: brand/GeoPov_logo_editable.svg
    right:
      - text: "Internal Resources"
        menu:
          - text: "Prosperity"
            href: http://prosperity/
            target: _blank
          - text: "GeoPov"
            href: http://geopov/
            target: _blank
          - text: "Distributional Impact of Policies"
            href: http://poverty/
            target: _blank
      - icon: github
        href: https://github.com/worldbank/geoPovLearn
        aria-label: GitHub
        target: _blank
  sidebar:
    style: "docked"
    search: true
    logo: assets/geopov-logo.png
    contents:
      - text: "About Us"
        href: index.qmd
      - section: "GeoPov BBL Series"
        href: seminars/index.qmd
        contents:
          - text: Revolutionizing Coding in Stata/R
            href: seminars/seminar-2026-02/overview.qmd
            contents:
            # - text: Slides
            #   href: seminars/seminar-2026-02/slides.qmd
            - text: Setup instructions
              href: seminars/seminar-2026-02/setup-instructions.qmd
            - text: Q/A
              href: seminars/seminar-2026-02/qa.qmd
          - text: Geocoding GMD
            href: seminars/seminar-2025-10/overview.qmd
      - section: "Other Materials"
        contents:
          - text: Fast & Big Data in R
            href: seminars/seminar-2026-06/overview.qmd
            contents:
              - text: "Part 1 — Serialization"
                href: seminars/seminar-2026-06/serialization.qmd
              - text: "Part 2 — Data Wrangling"
                href: seminars/seminar-2026-06/data-wrangling.qmd
  page-footer:
    background: "#e8eaed"
    foreground: "#555555"
    left: "© 2026 World Bank Group. All Rights Reserved."
  resources:
    - brand/*

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    title-block-banner: brand/Geopov_banner_flipped.svg
    title-block-banner-color: "#FFFFFF"
    include-in-header:
      text: |
        <style>
          /* Center the whole content block (sidebar + body + TOC) on wide
             screens instead of letting it hug the left edge. Below this
             breakpoint the layout already fills the viewport, so leave it. */
          @media (min-width: 1400px) {
            #quarto-content.page-columns {
              max-width: 1400px;
              margin-left: auto;
              margin-right: auto;
            }
          }
        </style>
